name: Verify
on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main, 'cloud/**', 'sx/**', 'hotfix/**']
permissions:
  contents: read
concurrency:
  group: verify-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref == 'refs/heads/main' && github.run_id || github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
jobs:
  plan:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
    outputs:
      skip: ${{ steps.reuse.outputs.skip }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
          persist-credentials: false
      - id: reuse
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
          SAME_REPO: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          WF_REF: ${{ github.workflow_ref }}
        run: |
          set -euo pipefail
          wf="${WF_REF%@*}"; wf="${wf##*/}"
          # Evidence is only a push run of this workflow from this repository, never this run: a pull request
          # tests its merge ref, a dispatch may run a subset, and a PR run of this workflow may itself be a skip.
          # Prints "<status> <conclusion>" of the newest such run on SHA $1, or nothing (any API error: nothing).
          newest_push() {
            gh api "repos/$GITHUB_REPOSITORY/actions/workflows/$wf/runs?head_sha=$1&event=push&per_page=100" \
              --jq "[.workflow_runs[] | select(.head_repository.full_name == \"$GITHUB_REPOSITORY\" and .id != $GITHUB_RUN_ID)] | max_by(.id) | select(. != null) | \"\(.status) \(.conclusion)\"" || true
          }
          green() { [ "$(newest_push "$1")" = "completed success" ]; }
          skip=false
          # C1: main push of a SHA whose newest push run of this workflow (a branch run) is green.
          if [ "$EVENT" = push ] && [ "$REF" = refs/heads/main ] && green "$GITHUB_SHA"; then skip=true; fi
          # C3 (exact): same tree as the parent, and the parent's newest push run is green (e.g. an empty commit).
          if [ "$skip" = false ] && [ "$EVENT" = push ] && parent=$(git rev-parse -q --verify HEAD~1) \
             && [ "$(git rev-parse 'HEAD^{tree}')" = "$(git rev-parse 'HEAD~1^{tree}')" ] && green "$parent"; then skip=true; fi
          # C2: same-repository PR. The lander takes any green same-repo run on the exact SHA as evidence,
          # pull_request runs included, so this run may pass without shards only when the push run on the
          # PR head is green: wait for it (at most 25 minutes).
          # No push run, any other result, or the wait running out: run in full.
          if [ "$EVENT" = pull_request ] && [ "$SAME_REPO" = true ]; then
            for _ in $(seq 1 50); do
              state=$(newest_push "$PR_HEAD")
              case "$state" in
                'completed success') skip=true; break ;;
                ''|completed\ *) break ;;
                *) sleep 30 ;;
              esac
            done
          fi
          echo "skip=$skip" >> "$GITHUB_OUTPUT"

  shards:
    needs: plan
    if: needs.plan.outputs.skip != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5]
    env:
      LINEN_VERIFY_SHARD: '${{ matrix.shard }}/5'
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.12.4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - name: Configure CI package installation
        run: |
          # Avoid the throttled Azure mirror observed in cancelled setup steps.
          # Hosted images use this mirror+file list for their active sources.
          printf '%s\n' 'http://archive.ubuntu.com/ubuntu' | sudo tee /etc/apt/apt-mirrors.txt
          sudo sed -i 's|azure.archive.ubuntu.com|archive.ubuntu.com|g' /etc/apt/sources.list.d/ubuntu.sources
          # Every verifier starts fresh after installation; unrelated host daemons
          # need not restart. Ubuntu documents restoring this mode here:
          # https://discourse.ubuntu.com/t/needrestart-changes-in-ubuntu-24-04-service-restarts/44671
          sudo sed -i 's/ -m u//g' /etc/apt/apt.conf.d/99needrestart
          sudo install -d /etc/needrestart/conf.d
          printf '%s\n' '$nrconf{restart} = "l";' | sudo tee /etc/needrestart/conf.d/linen-ci.conf
      - name: Install Linux engineering sandbox
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends bubblewrap apparmor-profiles
          # Ubuntu's packaged profile permits bwrap's namespace setup while
          # denying capabilities to its children; retain system-wide restrictions.
          # https://discourse.ubuntu.com/t/understanding-apparmor-user-namespace-restriction/58007
          sudo apparmor_parser --replace /usr/share/apparmor/extra-profiles/bwrap-userns-restrict
      - name: Check Linux engineering sandbox prerequisites
        shell: bash
        run: |
          # Exercise the mounts and namespace flags from engineering-agent/runner.mjs
          # before the full verification, including setup-node's executable path.
          sandbox_root=$(mktemp -d)
          trap 'rm -rf "$sandbox_root"' EXIT
          sandbox_work="$sandbox_root/work"
          sandbox_temp="$sandbox_root/scratch"
          mkdir "$sandbox_work" "$sandbox_temp"
          node_executable=$(readlink -f "$(command -v node)")
          mounts=()
          for dir in /usr /bin /lib /lib64 /sbin "$(dirname "$node_executable")"; do
            if [ -e "$dir" ]; then
              mounts+=(--ro-bind "$dir" "$dir")
            fi
          done
          bwrap --die-with-parent --unshare-all "${mounts[@]}" \
            --bind "$sandbox_work" "$sandbox_work" --bind "$sandbox_temp" "$sandbox_temp" \
            --proc /proc --dev /dev --chdir "$sandbox_work" \
            "$node_executable" -e 'require("node:fs").writeFileSync("probe", "ok")'
          test "$(cat "$sandbox_work/probe")" = ok
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec rer check --profile first-party
      - name: Install Chromium
        run: |
          set -euo pipefail
          pnpm exec playwright install chromium
          # Hosted ubuntu-24.04 already carries Chromium's libraries. Use apt only when a real launch fails.
          node scripts/ci/chromium-probe.mjs || {
            timeout 420 pnpm exec playwright install-deps chromium
            node scripts/ci/chromium-probe.mjs
          }
      - run: pnpm exec rer verify

  verify:
    needs: [plan, shards]
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 1
    steps:
      - name: Require the plan and every shard
        env:
          PLAN: ${{ needs.plan.result }}
          SKIP: ${{ needs.plan.outputs.skip }}
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          test "$PLAN" = success
          if [ "$SKIP" = true ]; then exit 0; fi
          for result in $RESULTS; do test "$result" = success; done
