name: Verify
on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main, cloud/tp-slim-linen-1, cloud/tp-slim-linen-audit-2]
permissions:
  contents: read
concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true
jobs:
  light:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec rer check --profile first-party
      - run: node src/base/contract-docs.mjs check
      - run: pnpm typecheck
      - run: pnpm source:check
      - run: pnpm test:site
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec rer build
      - uses: actions/upload-artifact@v4
        with:
          name: linen-verified-build
          path: dist/
          include-hidden-files: true
          retention-days: 1
  journeys:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6]
    env:
      LINEN_VERIFY_SHARD: '${{ matrix.shard }}/6'
      LINEN_TEST_BUILT: '1'
      CI: 'true'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v4
        with:
          name: linen-verified-build
          path: dist/
      - name: Install browser and engineering sandbox
        timeout-minutes: 9
        run: |
          # Base 144aa3ff mirror fallback: one mirror per attempt, first completed attempt fixes the mirror.
          mirrors=(http://azure.archive.ubuntu.com/ubuntu http://mirrors.edge.kernel.org/ubuntu http://us-east-1.ec2.archive.ubuntu.com/ubuntu)
          sudo sed -i 's/ -m u//g' /etc/apt/apt.conf.d/99needrestart
          sudo install -d /etc/needrestart/conf.d
          printf '%s\n' '$nrconf{restart} = "l";' | sudo tee /etc/needrestart/conf.d/linen-ci.conf
          printf '%s\n' 'Acquire::Retries "2";' 'Acquire::http::Timeout "30";' 'Acquire::https::Timeout "30";' | sudo tee /etc/apt/apt.conf.d/99linen-ci-acquire
          started=$SECONDS
          chosen=
          for attempt in 1 2 3; do
            mirror=${mirrors[attempt - 1]}
            sudo sed -i -E "s@^(URIs:[[:space:]]*)https?://(([a-z0-9.-]+\.)?archive\.ubuntu\.com|security\.ubuntu\.com|mirrors\.edge\.kernel\.org)/ubuntu/?@\1${mirror}/@" /etc/apt/sources.list.d/ubuntu.sources
            printf 'Browser deps apt: attempt %s/3 (90s deadline; mirror %s)\n' "$attempt" "$mirror"
            if sudo timeout --kill-after=5s 90s bash -ec '
              apt-get update
              DEBIAN_FRONTEND=noninteractive apt-get install --yes --no-install-recommends bubblewrap apparmor-profiles
            '; then
              chosen=$mirror
              printf 'Browser deps apt: complete (attempt=%s mirror=%s seconds=%s)\n' "$attempt" "$mirror" "$((SECONDS - started))"
              break
            else
              status=$?
              printf 'Browser deps apt: attempt %s/3 failed (mirror %s, exit %s, seconds=%s)\n' "$attempt" "$mirror" "$status" "$((SECONDS - started))" >&2
            fi
            if (( attempt < 3 )); then sleep "$((attempt * 2))"; fi
          done
          if [ -z "$chosen" ]; then
            printf 'Browser deps apt: failed on all 3 mirrors (seconds=%s)\n' "$((SECONDS - started))" >&2
            exit 1
          fi
          sudo apparmor_parser --replace /usr/share/apparmor/extra-profiles/bwrap-userns-restrict
          for attempt in 1 2; do
            printf 'Playwright deps: attempt %s/2 (120s deadline; mirror %s)\n' "$attempt" "$chosen"
            if timeout --kill-after=5s 120s pnpm exec playwright install --with-deps chromium; then
              exit 0
            else
              status=$?
              printf 'Playwright deps: attempt %s/2 failed (exit %s, seconds=%s)\n' "$attempt" "$status" "$((SECONDS - started))" >&2
            fi
            if (( attempt < 2 )); then sleep 5; fi
          done
          printf 'Playwright deps: failed after 2 attempts (seconds=%s)\n' "$((SECONDS - started))" >&2
          exit 1
      - name: Check Linux engineering sandbox prerequisites
        shell: bash
        run: |
          sandbox_root=$(mktemp -d)
          trap 'rm -rf "$sandbox_root"' EXIT
          sandbox_work="$sandbox_root/work"
          sandbox_temp="$sandbox_root/scratch"
          mkdir "$sandbox_work" "$sandbox_temp"
          node_executable=$(readlink -f "$(command -v node)")
          mounts=()
          for dir in /usr /bin /lib /lib64 /sbin "$(dirname "$node_executable")"; do
            if [ -e "$dir" ]; then mounts+=(--ro-bind "$dir" "$dir"); fi
          done
          bwrap --die-with-parent --unshare-all "${mounts[@]}" \
            --bind "$sandbox_work" "$sandbox_work" --bind "$sandbox_temp" "$sandbox_temp" \
            --proc /proc --dev /dev --chdir "$sandbox_work" \
            "$node_executable" -e 'require("node:fs").writeFileSync("probe", "ok")'
          test "$(cat "$sandbox_work/probe")" = ok
      - run: pnpm exec rer verify
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: journey-timings-${{ matrix.shard }}
          path: .wrangler/verification/results.json
          retention-days: 3
  verify:
    if: always()
    needs: [light, build, journeys]
    runs-on: ubuntu-24.04
    steps:
      - name: Require every verification tier
        env:
          RESULTS: "${{ join(needs.*.result, ',') }}"
        run: test "$RESULTS" = success,success,success
