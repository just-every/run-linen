name: Verify
on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main, cloud/tp-slim-linen-1, cloud/tp-slim-linen-audit-2]
permissions:
  contents: read
concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true
jobs:
  light:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec rer check --profile first-party
      - run: node src/base/contract-docs.mjs check
      - run: pnpm typecheck
      - run: pnpm source:check
      - run: pnpm test:site
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec rer build
      - uses: actions/upload-artifact@v4
        with:
          name: linen-verified-build
          path: dist/
          include-hidden-files: true
          retention-days: 1
  journeys:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6]
    env:
      LINEN_VERIFY_SHARD: '${{ matrix.shard }}/6'
      LINEN_TEST_BUILT: '1'
      CI: 'true'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v4
        with:
          name: linen-verified-build
          path: dist/
      - name: Install browser and engineering sandbox
        run: |
          printf '%s\n' 'http://archive.ubuntu.com/ubuntu' | sudo tee /etc/apt/apt-mirrors.txt
          sudo sed -i 's|azure.archive.ubuntu.com|archive.ubuntu.com|g' /etc/apt/sources.list.d/ubuntu.sources
          sudo sed -i 's/ -m u//g' /etc/apt/apt.conf.d/99needrestart
          sudo install -d /etc/needrestart/conf.d
          printf '%s\n' '$nrconf{restart} = "l";' | sudo tee /etc/needrestart/conf.d/linen-ci.conf
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends bubblewrap apparmor-profiles
          sudo apparmor_parser --replace /usr/share/apparmor/extra-profiles/bwrap-userns-restrict
          pnpm exec playwright install --with-deps chromium
      - name: Check Linux engineering sandbox prerequisites
        shell: bash
        run: |
          sandbox_root=$(mktemp -d)
          trap 'rm -rf "$sandbox_root"' EXIT
          sandbox_work="$sandbox_root/work"
          sandbox_temp="$sandbox_root/scratch"
          mkdir "$sandbox_work" "$sandbox_temp"
          node_executable=$(readlink -f "$(command -v node)")
          mounts=()
          for dir in /usr /bin /lib /lib64 /sbin "$(dirname "$node_executable")"; do
            if [ -e "$dir" ]; then mounts+=(--ro-bind "$dir" "$dir"); fi
          done
          bwrap --die-with-parent --unshare-all "${mounts[@]}" \
            --bind "$sandbox_work" "$sandbox_work" --bind "$sandbox_temp" "$sandbox_temp" \
            --proc /proc --dev /dev --chdir "$sandbox_work" \
            "$node_executable" -e 'require("node:fs").writeFileSync("probe", "ok")'
          test "$(cat "$sandbox_work/probe")" = ok
      - run: pnpm exec rer verify
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: journey-timings-${{ matrix.shard }}
          path: .wrangler/verification/results.json
          retention-days: 3
  verify:
    if: always()
    needs: [light, build, journeys]
    runs-on: ubuntu-24.04
    steps:
      - name: Require every verification tier
        env:
          RESULTS: "${{ join(needs.*.result, ',') }}"
        run: test "$RESULTS" = success,success,success
